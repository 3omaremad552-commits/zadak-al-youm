name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate project files
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          find_package_dir() {
            find "$1" -type f -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*' \
              -print -quit | xargs -r dirname
          }

          PROJECT_DIR="$(find_package_dir . || true)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit || true)"
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p extracted-project
              unzip -q "$ZIP_FILE" -d extracted-project
              PROJECT_DIR="$(find_package_dir extracted-project || true)"
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo 'لم يتم العثور على package.json.'
            echo 'ارفع ملفات مشروع زادك اليوم أو ملف ZIP الخاص به إلى المستودع.'
            echo 'الملفات الموجودة حاليًا:'
            find . -maxdepth 4 -type f -not -path './.git/*' | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "تم العثور على المشروع في: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zadak-al-youom-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
